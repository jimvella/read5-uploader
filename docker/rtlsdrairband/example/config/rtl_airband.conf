# One RTL-SDR dongle, one channel: Perth Clearance Delivery on 118.55 MHz.
# Keyword reference: https://github.com/rtl-airband/RTLSDR-Airband/wiki

# Where the container's Prometheus exporter (port 8001) looks for the stats.
stats_filepath = "/tmp/rtl_airband_stats.txt";

devices: (
  {
    type = "rtlsdr";
    index = 0;               # or serial = "..."; with more than one dongle
    gain = 32.8;
    centerfreq = 118.75;     # off the channel, so the tuner's DC spike isn't on it
    correction = 0;
    # Read5 can't record scan mode: the audio doesn't say which frequency it is.
    mode = "multichannel";
    channels: (
      {
        freq = 118.55;
        label = "Perth Clearance Delivery";
        bandwidth = 10000;   # 10 kHz audio filter
        outputs: (
          # Read5: one of these per channel, each with its own port.
          { type = "udp_stream"; dest_address = "127.0.0.1"; dest_port = 6101; continuous = true; },
          # The container's own Icecast server (http://<host>:8000). Remove
          # it and set ICECAST_DISABLE=true if you only feed Read5.
          { type = "icecast"; server = "127.0.0.1"; port = 8000; mountpoint = "acd.mp3";
            username = "source"; password = "rtlsdrairband";
            name = "Perth Clearance Delivery"; genre = "ATC"; }
        );
      }
    );
  }
);
