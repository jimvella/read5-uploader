[package]
name = "read5-uploader"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Records rtl_airband's UDP audio streams and uploads them to Read5 as per-minute Opus archives"
repository = "https://github.com/jimvella/read5-uploader"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
md-5 = "0.10"
base64 = "0.22"
zip = { version = "2", default-features = false }
ogg = "0.9"
audiopus = "0.3.0-rc.0"
ebur128 = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
socket2 = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["socket", "uio", "time"] }

[target.'cfg(unix)'.dependencies]
sd-notify = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
